<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看海 · 慢慢的海边</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#cde6e8,#a8ced3);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
/* 舞台保持 16:9，随窗口自适应，手机横屏和电脑都能看 */
#stage{
  position:relative;
  width:min(100vw,calc(100vh*16/9));
  height:min(calc(100vw*9/16),100vh);
  border-radius:8px;overflow:hidden;
  box-shadow:0 12px 46px rgba(50,100,110,.28);
  background:#bfe0e2;
}
#game{display:block;width:100%;height:100%;cursor:pointer}
#hud{position:absolute;inset:0;pointer-events:none}
#tideBox{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.55);backdrop-filter:blur(5px);border-radius:14px;
  padding:7px 16px 8px;text-align:center}
#tideTitle{font-size:11px;color:#6d959c;letter-spacing:6px;text-indent:6px}
#tideBar{position:relative;width:150px;height:8px;border-radius:4px;margin:6px auto 5px;
  background:linear-gradient(90deg,#e0cfa6,#8ec7d0)}
#tideMark{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #79b3bd;transform:translate(-50%,-50%);
  box-shadow:0 1px 3px rgba(60,100,110,.3)}
#bigStar{position:absolute;right:-3px;top:-9px;font-size:13px;color:#d9b45a;display:none}
#tideLabel{font-size:12px;color:#4d7a83;min-height:16px}
.btn{pointer-events:auto;cursor:pointer;border:none;border-radius:18px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(5px);color:#4d7a83;
  font-size:14px;padding:8px 14px;font-family:inherit}
.btn:active{transform:scale(.95)}
#bookBtn{position:absolute;top:12px;right:12px}
#bookBtn span{font-size:12px;color:#8fb0b5;margin-left:4px}
#muteBtn{position:absolute;bottom:12px;right:12px;width:40px;height:40px;border-radius:50%;
  font-size:17px;padding:0;line-height:1}
#toast{position:absolute;left:50%;bottom:29%;transform:translateX(-50%);
  background:rgba(255,255,255,.78);color:#5a8189;padding:7px 18px;border-radius:17px;
  font-size:14px;opacity:0;transition:opacity .45s;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1}
/* ---------- 图鉴面板（物品 / 句子 两个页签） ---------- */
#bookPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(92%,640px);max-height:84%;overflow-y:auto;
  background:rgba(252,254,253,.94);border-radius:18px;
  padding:14px 18px 16px;pointer-events:auto;display:none;
  box-shadow:0 14px 44px rgba(50,100,110,.28)}
#bookPanel.open{display:block}
#bookHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#bookTabs{display:flex;gap:4px}
.tab{border:none;background:rgba(125,180,189,.16);color:#4d7a83;font-size:13px;
  padding:4px 12px;border-radius:12px;cursor:pointer;font-family:inherit}
.tab.on{background:#7db4bd;color:#fff}
#bookCount{font-size:13px;color:#8fb0b5;margin-left:auto}
#closeBook{border:none;background:none;font-size:22px;color:#8fb0b5;cursor:pointer;line-height:1}
.rarityRow{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:4px;margin-bottom:6px}
.rarityHead{width:100%;display:flex;align-items:center;gap:5px;font-size:12px;color:#8fb0b5;padding-left:2px}
.rarityDot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.bookItem{width:88px;text-align:center}
.bookItem canvas{width:54px;height:54px;display:block;margin:0 auto}
.bookItem .rarityDot{margin:1px auto 0;display:block}
.bookName{font-size:13px;color:#4d7a83;margin-top:1px}
.bookNum{font-size:12px;color:#9db8bc;margin-top:1px}
#noteList{max-height:300px;overflow-y:auto;padding-right:4px}
.noteLine{font-size:13px;color:#4d7a83;line-height:1.7;padding:4px 0;
  border-bottom:1px dashed rgba(125,180,189,.25)}
.noteEmpty{font-size:13px;color:#9db8bc;text-align:center;padding:26px 0}
/* ---------- 看海日记页 ---------- */
.diaryRow{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:#4d7a83;padding:7px 2px;
  border-bottom:1px dashed rgba(125,180,189,.25)}
.diaryRow b{font-size:14px;color:#3c6a74;font-weight:600}
.diarySum{text-align:center;font-size:13px;color:#8fa8ac;line-height:1.7;
  padding:14px 6px 2px;font-style:italic}
/* ---------- 海边的朋友页 ---------- */
.friendRow{display:flex;justify-content:center;gap:26px;padding:12px 0 4px;flex-wrap:wrap}
.friendCard{width:104px;text-align:center}
.friendCard canvas{width:56px;height:56px;display:block;margin:0 auto}
.friendName{font-size:13px;color:#4d7a83;margin-top:2px}
.friendNum{font-size:12px;color:#9db8bc;margin-top:1px}
/* ---------- 漂流瓶纸条 ---------- */
#notePanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);
  width:min(80%,420px);background:#fbf6ea;border-radius:14px;padding:18px 24px 20px;
  pointer-events:auto;display:none;box-shadow:0 14px 40px rgba(90,80,60,.25)}
#notePanel.open{display:block}
#noteTitle{font-size:11px;color:#b3a789;letter-spacing:4px;text-align:center;margin-bottom:8px}
#noteText{font-size:15px;line-height:1.8;color:#6b5f4a;text-align:center;min-height:54px;
  display:flex;align-items:center;justify-content:center}
#noteOk{display:block;margin:12px auto 0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="tideBox">
      <div id="tideTitle">潮汐</div>
      <div id="tideBar"><div id="tideMark"></div><div id="bigStar">★</div></div>
      <div id="tideLabel">…</div>
    </div>
    <button class="btn" id="bookBtn">图鉴<span id="miniCount">0/7</span></button>
    <button class="btn" id="muteBtn">🔊</button>
    <div id="toast"></div>
    <div id="bookPanel">
      <div id="bookHead">
        <div id="bookTabs">
          <button class="tab on" id="tabItems">物品</button>
          <button class="tab" id="tabNotes">句子</button>
          <button class="tab" id="tabDiary">日记</button>
          <button class="tab" id="tabFriends">朋友</button>
        </div>
        <span id="bookCount">0/7</span>
        <button id="closeBook">×</button>
      </div>
      <div id="bookList"></div>
      <div id="noteList" style="display:none"></div>
      <div id="diaryList" style="display:none"></div>
      <div id="friendList" style="display:none"></div>
    </div>
    <div id="notePanel">
      <div id="noteTitle">· 漂流瓶 ·</div>
      <div id="noteText"></div>
      <button class="btn" id="noteOk">收好</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   基础设置：画布逻辑分辨率固定 1280x720（16:9），
   实际像素按窗口大小 + 设备像素比缩放，所有绘制都用逻辑坐标
   ============================================================ */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=1280,H=720;
const HORIZON=250;   // 海平线高度
const WET_TOP=460;   // 沙滩绘制起点（大退潮时才整片露出来）
let sx=1,sy=1;
function resize(){
  const r=document.getElementById('stage').getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(2,Math.round(r.width*dpr));
  canvas.height=Math.max(2,Math.round(r.height*dpr));
  sx=canvas.width/W;sy=canvas.height/H;
}
window.addEventListener('resize',resize);
resize();

/* ============================================================
   物品种类：全部用 Canvas 几何图形画，不依赖图片/Emoji
   rarity：0 常见 / 1 少见 / 2 稀有
   wetOnly：只在大退潮露出的湿沙带出现
   ============================================================ */
function drawScallop(c,s){
  c.beginPath();
  c.moveTo(0,s*0.32);
  c.arc(0,s*0.32,s,-Math.PI*0.85,-Math.PI*0.15);
  c.closePath();
  c.fillStyle='#f7ead0';c.fill();
  c.strokeStyle='#dcb98c';c.lineWidth=1.6;c.stroke();
  c.beginPath();
  for(let i=1;i<=4;i++){
    const a=-Math.PI*0.85+Math.PI*0.7*(i/5);
    c.moveTo(0,s*0.32);
    c.lineTo(Math.cos(a)*s*0.92,s*0.32+Math.sin(a)*s*0.92);
  }
  c.strokeStyle='rgba(214,178,128,.55)';c.lineWidth=1.2;c.stroke();
  c.beginPath();c.arc(0,s*0.32,s*0.2,0,Math.PI*2);
  c.fillStyle='#e9d2a4';c.fill();
}
function drawClam(c,s){
  c.beginPath();
  c.ellipse(0,0,s*0.95,s*0.62,0,0,Math.PI*2);
  c.fillStyle='#f3e9d6';c.fill();
  c.strokeStyle='#d9c29a';c.lineWidth=1.6;c.stroke();
  c.beginPath();
  c.ellipse(0,0,s*0.6,s*0.38,0,0,Math.PI*2);
  c.strokeStyle='rgba(205,178,135,.7)';c.lineWidth=1.2;c.stroke();
  c.beginPath();c.moveTo(-s*0.92,0);c.lineTo(s*0.92,0);
  c.strokeStyle='rgba(205,178,135,.45)';c.stroke();
}
function drawStar(c,s){
  c.beginPath();
  for(let i=0;i<10;i++){
    const r=(i%2===0)?s:s*0.45;
    const a=-Math.PI/2+i*Math.PI/5;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
  }
  c.closePath();
  c.fillStyle='#f4a98b';c.fill();
  c.strokeStyle='#dd8f70';c.lineWidth=2;c.lineJoin='round';c.stroke();
}
function drawConch(c,s){
  c.beginPath();
  for(let a=0;a<=Math.PI*3;a+=0.12){
    const r=s*0.1+a*s*0.095;
    const x=Math.cos(a)*r,y=Math.sin(a)*r*0.85;
    if(a===0)c.moveTo(x,y);else c.lineTo(x,y);
  }
  c.strokeStyle='#e3bd8e';c.lineWidth=s*0.28;c.lineCap='round';c.stroke();
}
function drawGlass(c,s){
  c.save();
  c.rotate(-0.3);
  c.beginPath();
  if(c.roundRect)c.roundRect(-s*0.7,-s*0.5,s*1.4,s,s*0.35);
  else c.rect(-s*0.7,-s*0.5,s*1.4,s);
  c.fillStyle='rgba(126,196,186,0.85)';c.fill();
  c.strokeStyle='rgba(255,255,255,0.55)';c.lineWidth=1.5;c.stroke();
  c.beginPath();c.moveTo(-s*0.35,-s*0.12);c.lineTo(s*0.12,-s*0.12);
  c.strokeStyle='rgba(255,255,255,0.7)';c.lineWidth=2;c.stroke();
  c.restore();
}
function drawMoon(c,s){
  c.beginPath();
  c.arc(0,0,s*0.88,0,Math.PI*2);
  c.fillStyle='#edf4f6';c.fill();
  c.strokeStyle='#bcd7de';c.lineWidth=1.5;c.stroke();
  c.beginPath();
  for(let a=0;a<=Math.PI*2.5;a+=0.12){
    const r=a*s*0.1;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    if(a===0)c.moveTo(x,y);else c.lineTo(x,y);
  }
  c.strokeStyle='rgba(150,190,205,.8)';c.lineWidth=1.4;c.stroke();
  c.beginPath();c.arc(-s*0.3,-s*0.32,s*0.14,0,Math.PI*2);
  c.fillStyle='rgba(255,255,255,.9)';c.fill();
}
function drawCoral(c,s){
  c.strokeStyle='#f0a58e';c.lineCap='round';
  c.lineWidth=s*0.28;
  c.beginPath();c.moveTo(0,s*0.7);c.quadraticCurveTo(s*0.05,0,-s*0.1,-s*0.75);c.stroke();
  c.lineWidth=s*0.2;
  c.beginPath();c.moveTo(s*0.02,s*0.05);c.quadraticCurveTo(s*0.45,-s*0.15,s*0.62,-s*0.6);c.stroke();
  c.beginPath();c.moveTo(0,s*0.3);c.quadraticCurveTo(-s*0.42,s*0.05,-s*0.6,-s*0.35);c.stroke();
  c.lineWidth=s*0.12;
  c.beginPath();c.moveTo(-s*0.1,-s*0.5);c.lineTo(-s*0.05,-s*0.9);c.stroke();
}
function drawBottle(c,s){
  c.save();
  c.rotate(-0.5);
  c.beginPath();
  if(c.roundRect)c.roundRect(-s*0.5,-s*0.75,s,s*1.5,s*0.35);
  else c.rect(-s*0.5,-s*0.75,s,s*1.5);
  c.fillStyle='rgba(178,222,226,0.5)';c.fill();
  c.strokeStyle='rgba(255,255,255,0.7)';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#d8b98a';
  c.fillRect(-s*0.16,-s*1.0,s*0.32,s*0.28);
  c.beginPath();c.ellipse(0,s*0.1,s*0.16,s*0.34,0,0,Math.PI*2);
  c.fillStyle='rgba(255,252,240,0.9)';c.fill();
  c.strokeStyle='rgba(200,190,160,.6)';c.lineWidth=1;c.stroke();
  c.restore();
}
/* 小螃蟹：沙堆里挖出来时会横着跑掉（t 是跑动时长，用来摆腿） */
function drawCrab(c,s,t){
  const wig=t*16;
  c.strokeStyle='#d97757';c.lineWidth=2;c.lineCap='round';
  for(const side of [-1,1]){
    for(let i=0;i<3;i++){
      const lx=side*(s*0.55+i*s*0.2);
      const ly=s*0.4+Math.sin(wig+i*1.7+side)*s*0.1;
      c.beginPath();c.moveTo(side*s*0.35,s*0.08);c.lineTo(lx,ly);c.stroke();
    }
    c.beginPath();c.moveTo(side*s*0.5,-s*0.12);c.lineTo(side*s*0.85,-s*0.38);c.stroke();
    c.beginPath();c.arc(side*s*0.95,-s*0.46,s*0.17,0,Math.PI*2);
    c.fillStyle='#e08a68';c.fill();
  }
  c.beginPath();c.ellipse(0,0,s*0.62,s*0.45,0,0,Math.PI*2);
  c.fillStyle='#e08a68';c.fill();
  c.strokeStyle='#c96f50';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#3d2f28';
  c.beginPath();c.arc(-s*0.18,-s*0.3,s*0.09,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(s*0.18,-s*0.3,s*0.09,0,Math.PI*2);c.fill();
}

/* ---------- v1.4：小生物的画法 ---------- */
function drawGull(c,s,flap){
  /* 一笔小海鸥：两段弧的翅膀，随 flap 上下扇 */
  c.strokeStyle='rgba(78,90,98,0.9)';c.lineWidth=2.2;c.lineCap='round';
  c.beginPath();
  c.moveTo(-s*1.7,-flap*s*0.9);
  c.quadraticCurveTo(-s*0.8,flap*s*0.3,-s*0.1,-s*0.05);
  c.quadraticCurveTo(s*0.8,flap*s*0.3,s*1.7,-flap*s*0.9);
  c.stroke();
}
function drawDolphin(c,s){
  /* 跃出的海豚：流线身体 + 背鳍 + 尾鳍 + 一点眼神 */
  c.fillStyle='#4e6a78';
  c.beginPath();
  c.moveTo(-s*1.35,s*0.18);
  c.quadraticCurveTo(-s*0.9,-s*0.5,0,-s*0.55);
  c.quadraticCurveTo(s*0.6,-s*0.5,s*1.1,s*0.08);
  c.quadraticCurveTo(s*0.45,s*0.32,-s*0.2,s*0.48);
  c.quadraticCurveTo(-s*0.95,s*0.5,-s*1.35,s*0.18);
  c.closePath();c.fill();
  c.beginPath();                    /* 背鳍 */
  c.moveTo(-s*0.2,-s*0.5);
  c.quadraticCurveTo(-s*0.05,-s*1.05,s*0.28,-s*0.9);
  c.quadraticCurveTo(s*0.22,-s*0.62,s*0.32,-s*0.48);
  c.closePath();c.fill();
  c.beginPath();                    /* 尾鳍 */
  c.moveTo(-s*1.3,s*0.15);
  c.quadraticCurveTo(-s*1.7,-s*0.2,-s*1.85,-s*0.42);
  c.quadraticCurveTo(-s*1.55,s*0.08,-s*1.68,s*0.32);
  c.closePath();c.fill();
  c.fillStyle='#2e4652';
  c.beginPath();c.arc(s*0.72,-s*0.12,s*0.07,0,Math.PI*2);c.fill();
}

/* ---------- v1.3：沙滩装饰的画法（纯 Canvas 几何，纯视觉） ---------- */
function drawChime(){
  /* 左上角一串小贝壳风铃，跟着海风轻轻摆 */
  const swing=Math.sin(timeSec*0.9)*4;      // 整串摆 ±4°
  ctx.strokeStyle='rgba(120,105,80,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(64,0);ctx.lineTo(48,14);ctx.stroke();
  ctx.save();
  ctx.translate(48,14);
  ctx.rotate(swing*Math.PI/180);
  const lens=[30,42,56,38,48];
  for(let i=0;i<5;i++){
    ctx.save();
    ctx.translate((i-2)*16,0);
    ctx.rotate(Math.sin(timeSec*0.9+i*1.2)*0.07);
    ctx.strokeStyle='rgba(150,130,100,0.7)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,lens[i]);ctx.stroke();
    ctx.translate(0,lens[i]+5);
    drawScallop(ctx,5+(i%3));
    ctx.restore();
  }
  ctx.restore();
}
function drawLight(){
  /* 右下角礁石上的一串小灯，天黑以后自己亮起来 */
  const lit=Math.max(0,(currentPal().night-0.2)/0.8);
  ctx.beginPath();
  ctx.moveTo(1128,668);
  ctx.quadraticCurveTo(1128,632,1152,628);
  ctx.quadraticCurveTo(1178,630,1186,652);
  ctx.quadraticCurveTo(1190,666,1178,670);
  ctx.lineTo(1136,670);
  ctx.closePath();
  ctx.fillStyle='#9a948a';ctx.fill();
  ctx.strokeStyle='rgba(110,104,94,0.6)';ctx.lineWidth=1.5;ctx.stroke();
  const pts=[[-30,-16],[-14,-26],[4,-28],[22,-22],[32,-8],[26,6],[6,12],[-16,10]];
  ctx.strokeStyle='rgba(90,80,65,0.7)';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(1158+pts[0][0],652+pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(1158+pts[i][0],652+pts[i][1]);
  ctx.stroke();
  for(const p of pts){
    const x=1158+p[0],y=652+p[1];
    if(lit>0.03){
      const g=ctx.createRadialGradient(x,y,0,x,y,10);
      g.addColorStop(0,'rgba(255,214,140,'+(0.75*lit).toFixed(3)+')');
      g.addColorStop(1,'rgba(255,214,140,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();
    }
    ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);
    ctx.fillStyle=lit>0.03?'rgba(255,226,170,'+(0.55+0.45*lit).toFixed(3)+')':'rgba(210,202,188,0.95)';
    ctx.fill();
  }
}
function drawUmbrella(){
  /* 沙滩右侧一把米白的伞：木杆、伞面、一小块安静的影子 */
  ctx.save();
  ctx.translate(1148,672);
  ctx.scale(1,0.32);
  ctx.beginPath();ctx.arc(26,0,56,0,Math.PI*2);
  ctx.fillStyle='rgba(90,75,55,0.14)';ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#a98d68';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(1148,672);ctx.lineTo(1136,536);ctx.stroke();
  ctx.save();
  ctx.translate(1136,536);
  ctx.rotate(-0.18);
  ctx.beginPath();
  ctx.moveTo(-54,8);
  ctx.quadraticCurveTo(0,-40,54,8);
  ctx.quadraticCurveTo(36,20,18,14);
  ctx.quadraticCurveTo(0,24,-18,14);
  ctx.quadraticCurveTo(-36,20,-54,8);
  ctx.closePath();
  ctx.fillStyle='#efe9dc';ctx.fill();
  ctx.strokeStyle='#cfc4ae';ctx.lineWidth=1.6;ctx.stroke();
  ctx.strokeStyle='rgba(190,178,155,0.55)';ctx.lineWidth=1;
  for(const fx of [-30,0,30]){
    ctx.beginPath();
    ctx.moveTo(fx,8-Math.abs(fx)*0.12);
    ctx.quadraticCurveTo(fx*0.55,-14,0,-32);
    ctx.stroke();
  }

function pickType(zone){
  const band=timeBand();
  const pool=TYPES.filter(t=>zone==='wet'?true:!t.wetOnly);
  let total=0;
  const ws=pool.map(t=>{
    let w=t.weight;

    /* v1.3：夜晚和黎明的月光螺更容易遇见，白天的海玻璃亮闪闪更好找 */
    if(t.id==='moon'&&(band===2||band===3))w*=2;

    total+=w;return w;
  });
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i].id;}
  return pool[0].id;
}

/* ============================================================
   潮汐状态
   tideLevel 在 0~1 之间：0 = 完全退潮，1 = 涨满潮。
   每 BIG_TIDE_EVERY 次退潮出现一次「大退潮」：
   水退得更低（露出湿沙带）、窗口更长、必出漂流瓶。
   ============================================================ */
const TIDE_PERIOD=15;      // 15 秒一个完整涨落周期
const LOW_TIDE_LINE=0.3;   // 普通退潮判定线
const BIG_TIDE_LINE=0.42;  // 大退潮判定线（窗口更长）
const BIG_TIDE_EVERY=4;    // 每 4 次退潮出现 1 次大退潮
const BIG_TIDE_LIFT=80;    // 大退潮额外退出的像素
const WATER_MIN=540,WATER_SPAN=100;
let timeSec=0,lastTs=null;
let retreatCount=0,bigTideActive=false,prevTide=1;
let lowWindowSpawns=0;
function tideLevel(){return (1-Math.cos(timeSec/TIDE_PERIOD*Math.PI*2+TIDE_PHASE_VAL))/2;}
const TIDE_PHASE_VAL=-1.159; // 开页正好是退潮开始，方便上手
function collectLine(){return bigTideActive?BIG_TIDE_LINE:LOW_TIDE_LINE;}
function canCollect(){return tideLevel()<collectLine();}
function nextIsBig(){return (retreatCount+1)%BIG_TIDE_EVERY===0;}
function bigLift(){
  if(!bigTideActive)return 0;
  const t=tideLevel();
  return t<BIG_TIDE_LINE?BIG_TIDE_LIFT*(BIG_TIDE_LINE-t)/BIG_TIDE_LINE:0;
}
function waterlineY(){return WATER_MIN+tideLevel()*WATER_SPAN-bigLift();}

/* ============================================================
   v1.3 昼夜循环：一个游戏日 = 现实 8 分钟。
   四个时段各 2 分钟：白天 → 黄昏 → 夜晚 → 黎明 → 又是白天。
   不存档，每次来都从白天开始；时段之间最后 20 秒平滑过渡。
   ============================================================ */
const DAY_LENGTH=480;
let dayTime=0;
function timeBand(){return Math.min(3,Math.floor(dayTime/120));}
function smooth01(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
/* 四个时段的画面关键帧 */
const PALS=[
  {skyT:'#d6eff0',skyB:'#eef8f1',seaB:'#a6dcd6',seaT:'#8ecacf',seaD:'#74b3c0',
    sand1:'#e4d0a8',sand2:'#eee0c3',sand3:'#e2cfa9',waveCol:'#ffffff',
    sunX:985,sunY:118,sunA:0.95,sunCol:'255,252,238',glowCol:'255,252,238',night:0},

    sand1:'#e3c9a2',sand2:'#ecd6b6',sand3:'#dfc39e',waveCol:'#fff4e4',
    sunX:935,sunY:186,sunA:0.95,sunCol:'255,214,160',glowCol:'255,196,140',night:0.15},
  {skyT:'#5f7a8c',skyB:'#8ba3b1',seaB:'#628b94',seaT:'#537787',seaD:'#446273',
    sand1:'#a8a099',sand2:'#b4aca4',sand3:'#9e968f',waveCol:'#e8f0f6',
    sunX:985,sunY:118,sunA:0,sunCol:'232,240,246',glowCol:'232,240,246',night:1},
  {skyT:'#c5e2e4',skyB:'#e9f2ee',seaB:'#90c9c6',seaT:'#83b6c0',seaD:'#6e9fae',
    sand1:'#d8d2c2',sand2:'#e6e2d6',sand3:'#d2ccc0',waveCol:'#fffcf6',
    sunX:905,sunY:168,sunA:0.8,sunCol:'255,240,214',glowCol:'255,236,205',night:0.25}
];
PALS.forEach(p=>{
  p._c={};
  for(const k of ['skyT','skyB','seaB','seaT','seaD','sand1','sand2','sand3','waveCol'])
    p._c[k]=hex2rgb(p[k]);
});
/* 当前这一帧的配色：时段尾 20 秒向下一时段慢慢过渡 */
function currentPal(){
  const band=timeBand();
  const lt=dayTime-band*120;              // 本时段已走过的秒数
  const a=PALS[band],b=PALS[(band+1)%4];
  const t=lt>100?smooth01((lt-100)/20):0;
  const mix=k=>'rgb('+a._c[k].map((v,i)=>Math.round(v+(b._c[k][i]-v)*t)).join(',')+')';
  const mixN=(A,B)=>A+(B-A)*t;
  const mixS=(A,B)=>{
    const x=A.split(',').map(Number),y=B.split(',').map(Number);
    return x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',');
  };
  return {
    band,
    skyT:mix('skyT'),skyB:mix('skyB'),
    seaB:mix('seaB'),seaT:mix('seaT'),seaD:mix('seaD'),
    sand1:mix('sand1'),sand2:mix('sand2'),sand3:mix('sand3'),
    waveCol:mix('waveCol'),
    sunX:mixN(a.sunX,b.sunX),sunY:mixN(a.sunY,b.sunY),sunA:mixN(a.sunA,b.sunA),
    sunCol:mixS(a.sunCol,b.sunCol),glowCol:mixS(a.glowCol,b.glowCol),
    night:mixN(a.night,b.night)
  };
}

function checkDecor(){
  const news=[];
  if(!decorUnlocked.includes('chime')
    &&counts.scallop>0&&counts.clam>0&&counts.conch>0&&counts.moon>0)news.push('chime');
  if(!decorUnlocked.includes('light')&&counts.glass>=5)news.push('light');
  if(!decorUnlocked.includes('umbrella')&&TYPES.every(t=>counts[t.id]>0))news.push('umbrella');
  for(const id of news){
    decorUnlocked.push(id);
    decorAge[id]=0;

}

function decA(id){return Math.min(1,(decorAge[id]===undefined?2:decorAge[id])/2);}
/* 刷物品时避开已经摆了装饰的位置 */
function decorFree(x,y){
  if(decorUnlocked.includes('umbrella')&&(x-1148)*(x-1148)+(y-600)*(y-600)<75*75)return false;
  if(decorUnlocked.includes('light')&&(x-1158)*(x-1158)+(y-640)*(y-640)<55*55)return false;
  return true;
}

  critters.push({kind:'crab',dir,
    x:dir>0?-30:W+30,y:588+Math.random()*100,
    t:0,dur:6+Math.random()*2,
    scare:false,scareT:0});
  crabSeen++;saveGame();
}
function spawnDolphin(){
  const dir=Math.random()<0.5?1:-1;
  critters.push({kind:'dolphin',dir,
    x0:180+Math.random()*(W-360),y0:300+Math.random()*50,
    t:0,dur:1.2});
  dolphinSeen++;saveGame();
  playSplash();
}

/* ---------- 潮汐状态切换（进入/离开退潮窗口，含大退潮） ---------- */
function checkTide(){
  const t=tideLevel();
  if(!bigTideActive&&prevTide>=BIG_TIDE_LINE&&t<BIG_TIDE_LINE&&nextIsBig()){
    /* 进入大退潮：湿沙带刷限定物品 + 必出漂流瓶 */
    bigTideActive=true;
    retreatCount++;
    lowWindowSpawns=0;
    spawnBatch(1+Math.floor(Math.random()*2),0.3,'wet');
    spawnBatch(2+Math.floor(Math.random()*2),0.5);
    spawnBottle(0.6);
    if(Math.random()<MOUND_CHANCE)spawnMounds(1+Math.floor(Math.random()*2),0.7);
    if(Math.random()<CRAB_WALK_CHANCE)spawnCrabWalk();
    showToast('今天退得特别远…');
  }else if(!bigTideActive&&prevTide>=LOW_TIDE_LINE&&t<LOW_TIDE_LINE){
    /* 进入普通退潮 */
    retreatCount++;
    lowWindowSpawns=0;
    spawnBatch(2+Math.floor(Math.random()*3),0.2);
    if(Math.random()<0.08)spawnBottle(0.4);
    if(Math.random()<MOUND_CHANCE)spawnMounds(1+Math.floor(Math.random()*2),0.5);
    if(Math.random()<CRAB_WALK_CHANCE)spawnCrabWalk();
  }
  if(bigTideActive&&prevTide<BIG_TIDE_LINE&&t>=BIG_TIDE_LINE){
    /* 离开大退潮窗口：涨潮把东西带走 */
    bigTideActive=false;
    for(const it of items)it.wash=true;
    for(const b of bottles)b.wash=true;
    for(const m of mounds)m.wash=true;
  }else if(!bigTideActive&&prevTide<LOW_TIDE_LINE&&t>=LOW_TIDE_LINE){
    /* 离开普通退潮窗口 */
    for(const it of items)it.wash=true;
    for(const b of bottles)b.wash=true;
    for(const m of mounds)m.wash=true;
  }
  prevTide=t;
}

function update(dt){
  timeSec+=dt;
  dayTime=(dayTime+dt)%DAY_LENGTH;   // v1.3：昼夜慢慢往前走
  stats.totalSec+=dt;
  checkTide();
  const low=canCollect();
  /* 涨潮期：海浪偶尔把一件好东西送上岸，退潮了就能捡 */
  if(!low&&timeSec>=deliverAt){
    deliverAt=timeSec+DELIVER_MIN+Math.random()*DELIVER_SPAN;
    if(Math.random()<DELIVER_CHANCE)spawnDelivery();
  }
  /* 退潮窗口里捡空了，补刷一两次 */
  if(low&&items.length===0&&lowWindowSpawns<2&&bottles.every(b=>b.wash)){
    lowWindowSpawns++;
    spawnBatch(1+Math.floor(Math.random()*2),1.0,
      bigTideActive&&Math.random()<0.5?'wet':undefined);
  }
  /* 物品：送礼的在 1.5 秒里随浪缓缓推上岸，其余淡入出现 / 涨潮淡出 */
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.wash){it.alpha-=dt*1.5;it.y+=dt*16;if(it.alpha<=0)items.splice(i,1);continue;}
    if(it.delivery&&!it.delivery.done){
      it.delivery.t+=dt;
      const p=Math.min(1,it.delivery.t/it.delivery.dur);
      /* 缓出为主，叠一点浪的脉动：像被浪一下一下推着走 */
      const ease=1-Math.pow(1-p,3)+Math.sin(p*Math.PI*3)*0.05*Math.sin(p*Math.PI);
      it.x=it.delivery.x0+(it.delivery.tx-it.delivery.x0)*ease;
      it.y=it.delivery.y0+(it.delivery.ty-it.delivery.y0)*ease;
      /* 身后留一串渐渐淡开的水迹 */
      it.delivery.trailT=(it.delivery.trailT||0)+dt;
      if(it.delivery.trailT>0.12){
        it.delivery.trailT=0;
        effects.push({kind:'trail',x:it.x,y:it.y+6,t:0,dur:0.9,r:5+Math.random()*4});
      }
      if(p>=1){
        it.delivery.done=true;
        effects.push({kind:'foam',x:it.x,y:it.y,t:0,dur:1.0});
        /* 到岸时溅起几点小水花 */
        for(let i=0;i<6;i++){
          const a=-Math.PI*(0.25+Math.random()*0.5);
          effects.push({kind:'splash',x:it.x,y:it.y,
            vx:Math.cos(a)*(30+Math.random()*60),vy:Math.sin(a)*(60+Math.random()*90),
            t:0,dur:0.5+Math.random()*0.2});
        }
      }
    }
    if(timeSec>=it.appearAt&&it.alpha<1){it.alpha=Math.min(1,it.alpha+dt/0.9);}
  }
  /* 漂流瓶：同上 */
  for(let i=bottles.length-1;i>=0;i--){
    const b=bottles[i];
    if(b.wash){b.alpha-=dt*1.5;if(b.alpha<=0)bottles.splice(i,1);}
    else if(timeSec>=b.appearAt&&b.alpha<1){b.alpha=Math.min(1,b.alpha+dt/0.9);}
  }
  /* 沙堆：淡入 / 每两秒冒一点小沙尘 / 挖开动画结算 / 螃蟹跑走 / 涨潮带走 */
  for(let i=mounds.length-1;i>=0;i--){
    const m=mounds[i];
    if(m.wash){m.alpha-=dt*1.5;if(m.alpha<=0){mounds.splice(i,1);continue;}}
    else if(timeSec>=m.appearAt&&m.alpha<1){m.alpha=Math.min(1,m.alpha+dt/0.9);}
    if(!m.dug&&m.alpha>0.5){
      m.puffT-=dt;
      if(m.puffT<=0){
        m.puffT=2;
        effects.push({kind:'puff',x:m.x+(Math.random()-0.5)*24,y:m.y-12,t:0,dur:0.8,
          drift:(Math.random()-0.5)*10});
      }
    }
    if(m.dug&&!m.settled){
      m.digT+=dt;
      if(m.digT>=0.5){m.settled=true;settleMound(m);}
    }
    if(m.settled&&m.result==='crab'){
      m.crabT+=dt;
      m.x+=m.crabDir*dt*85;
      if(m.crabT>1.4){mounds.splice(i,1);continue;}
    }
  }
  /* 波光：每 2~3.4 秒随机闪一次 */
  sparkleTimer-=dt;
  if(sparkleTimer<=0){
    sparkleTimer=2+Math.random()*1.4;
    sparkles.push({x:80+Math.random()*(W-160),y:315+Math.random()*175,
      len:(8+Math.random()*10)*(timeBand()===2?1.5:1),   // 夜里的波光拖得长一点
      t:0,dur:0.9+Math.random()*0.5,tilt:(Math.random()-0.5)*0.6});
  }
  for(const s of sparkles)s.t+=dt;
  sparkles=sparkles.filter(s=>s.t<s.dur);
  for(const e of effects)e.t+=dt;
  effects=effects.filter(e=>e.t<e.dur);
  /* v1.3：新装饰解锁后 2 秒里慢慢显形 */
  for(const id in decorAge){if(decorAge[id]<2)decorAge[id]+=dt;}
  /* v1.4：小生物——海鸥按点路过，海豚守着自己的钟，螃蟹走完这一段沙滩 */
  gullTimer-=dt;
  if(gullTimer<=0){gullTimer=GULL_MIN+Math.random()*GULL_SPAN;spawnGull();}
  dolphinTimer-=dt;
  if(dolphinTimer<=0){dolphinTimer=DOLPHIN_MIN+Math.random()*DOLPHIN_SPAN;spawnDolphin();}
  for(let i=critters.length-1;i>=0;i--){
    const c=critters[i];
    c.t+=dt;
    if(c.kind==='gull'){
      c.x+=c.dir*dt*(W+80)/c.dur;
      if(c.t>c.dur){critters.splice(i,1);continue;}
    }else if(c.kind==='crab'){
      if(c.scare){
        c.scareT+=dt;
        c.x+=c.dir*dt*180;                    // 被吓到：慌张加速
        if(c.scareT>1){critters.splice(i,1);continue;}   // 钻进沙里不见了
      }else{
        c.x+=c.dir*dt*(W+60)/c.dur;
        if(c.t>c.dur){critters.splice(i,1);continue;}
      }
    }else if(c.kind==='dolphin'){
      if(c.t>c.dur){critters.splice(i,1);continue;}
    }
  }
  /* 自动存档：每 5 秒一次 */
  saveTimer-=dt;
  if(saveTimer<=0){saveTimer=5;saveGame();}
}

/* ============================================================
   收集逻辑：点击画布 → 先看漂流瓶，再看物品；
   涨潮时点沙滩只给一句轻提示，什么都不会捡到
   ============================================================ */
let lastHint=-9;
let noteOpen=false,bookOpen=false;
function handleTap(x,y){
  if(noteOpen){closeNote();return;}
  if(bookOpen){closeBook();return;}
  let got=null,bottle=null;
  if(canCollect()){
    for(let i=bottles.length-1;i>=0;i--){
      const b=bottles[i];
      if(b.wash||b.alpha<0.5)continue;
      const dx=x-b.x,dy=y-b.y;
      if(dx*dx+dy*dy<1024){bottle=b;bottles.splice(i,1);break;}
    }
    if(!bottle){
      for(let i=items.length-1;i>=0;i--){
        const it=items[i];
        if(it.wash||it.alpha<0.5||(it.delivery&&!it.delivery.done))continue;
        const dx=x-it.x,dy=y-it.y;
        if(dx*dx+dy*dy<900){got=it;items.splice(i,1);break;}
      }
      /* 没点中物品：也许点的是沙堆，挖挖看 */
      if(!got){
        for(let i=mounds.length-1;i>=0;i--){
          const m=mounds[i];
          if(m.wash||m.dug||m.alpha<0.5)continue;
          const dx=x-m.x,dy=y-m.y;
          if(dx*dx+dy*dy<1156){digMound(m);break;}
        }
      }
    }
  }
  if(bottle){
    effects.push({kind:'ring',x:bottle.x,y:bottle.y,t:0,dur:0.6});
    openNote();
    return;
  }
  if(got){
    const tp=typeInfo(got.typeId);
    counts[got.typeId]++;
    stats.pickedTotal++;
    effects.push({kind:'ring',x:got.x,y:got.y,t:0,dur:0.6});
    effects.push({kind:'rise',x:got.x,y:got.y,t:0,dur:0.9,typeId:got.typeId});
    if(tp.rarity===2){showToast('捡到了稀有的'+tp.name+'！');playChime();}
    else if(tp.rarity===1)showToast('捡到了少见的'+tp.name+'！');
    else showToast('捡到了：'+tp.name);
    refreshBook();
    saveGame();
    checkDecor();   // v1.3：看看是不是凑齐了哪套装
    return;
  }
  /* v1.4：没点中别的，也许吓到了正在横行的小螃蟹 */
  for(const c of critters){
    if(c.kind!=='crab'||c.scare)continue;
    const dx=x-c.x,dy=y-c.y;
    if(dx*dx+dy*dy<3600){
      c.scare=true;c.scareT=0;
      showToast('小螃蟹钻进沙里躲起来了');
      return;
    }
  }
  if(y>waterlineY()+6&&!canCollect()&&timeSec-lastHint>2){
    lastHint=timeSec;
    showToast('还没退潮，慢慢等海水退下去~');
  }
}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W;
  const y=(e.clientY-r.top)/r.height*H;
  handleTap(x,y);
});

function refreshBook(){
  let lit=0;
  for(const t of TYPES){
    const e=entries[t.id],n=counts[t.id];
    const g=e.cv.getContext('2d');
    g.setTransform(2,0,0,2,0,0);
    g.clearRect(0,0,54,54);
    g.translate(27,27);
    if(n>0){
      lit++;
      g.globalAlpha=1;
      e.type.draw(g,15);
      e.nm.textContent=t.name;
      e.num.textContent='×'+n;
    }else{
      g.globalAlpha=0.15;
      e.type.draw(g,15);
      g.globalAlpha=0.55;
      g.fillStyle='#7a9aa0';g.font='14px sans-serif';
      g.textAlign='center';g.textBaseline='middle';
      g.fillText('?',0,0);
      e.nm.textContent='？？？';
      e.num.textContent='还没捡到';
    }
  }
  miniCountEl.textContent=lit+'/'+TYPES.length;
  if(activeTab==='items')bookCountEl.textContent=lit+'/'+TYPES.length;
  else if(activeTab==='notes')bookCountEl.textContent=collectedNotes.length+'/'+SENTENCES.length;
  else bookCountEl.textContent='';
}

/* ============================================================
   声音分三层：
   1) 海浪声：Web Audio 白噪音 + 低通滤波 + 慢速起伏（代码生成）
   2) 背景音乐：bgm.mp3（和 index.html 放一起，循环播放）
   3) 稀有物品的「叮」：合成的短正弦音
   都在玩家第一次点击屏幕后才开始（浏览器自动播放限制），
   右下角小按钮统一静音/恢复
   ============================================================ */
let audioCtx=null,masterGain=null,muted=false;
const muteBtnEl=document.getElementById('muteBtn');
const BGM_VOLUME=0.35;
const bgmEl=new Audio('bgm.mp3');
bgmEl.loop=true;
bgmEl.volume=BGM_VOLUME;
bgmEl.preload='auto';
let bgmStarted=false;
function playBgm(){
  if(bgmStarted)return;
  bgmStarted=true;
  bgmEl.play().catch(()=>{bgmStarted=false;});
}
function initAudio(){
  if(audioCtx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
    const len=audioCtx.sampleRate*2;
    const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=audioCtx.createBufferSource();
    src.buffer=buf;src.loop=true;
    const filt=audioCtx.createBiquadFilter();
    filt.type='lowpass';filt.frequency.value=420;filt.Q.value=0.6;
    const lfo=audioCtx.createOscillator();lfo.frequency.value=0.07;
    const lfoGain=audioCtx.createGain();lfoGain.gain.value=240;
    lfo.connect(lfoGain);lfoGain.connect(filt.frequency);
    const swell=audioCtx.createGain();swell.gain.value=0.7;
    const lfo2=audioCtx.createOscillator();lfo2.frequency.value=0.05;
    const lfo2Gain=audioCtx.createGain();lfo2Gain.gain.value=0.25;
    lfo2.connect(lfo2Gain);lfo2Gain.connect(swell.gain);
    masterGain=audioCtx.createGain();
    masterGain.gain.value=muted?0:0.06;
    src.connect(filt);filt.connect(swell);swell.connect(masterGain);
    masterGain.connect(audioCtx.destination);
    src.start();lfo.start();lfo2.start();
  }catch(e){/* 浏览器不支持就保持安静，不影响游戏 */}
}
function playChime(){
  if(!audioCtx||muted)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(0.14,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.35);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}
function playSplash(){
  /* v1.4：海豚跃出水面的那声水响——一撮快速低通的白噪 */
  if(!audioCtx||muted)return;
  try{
    const dur=0.4;
    const buf=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*dur),audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
    const src=audioCtx.createBufferSource();src.buffer=buf;
    const filt=audioCtx.createBiquadFilter();
    filt.type='lowpass';
    filt.frequency.setValueAtTime(1400,audioCtx.currentTime);
    filt.frequency.exponentialRampToValueAtTime(300,audioCtx.currentTime+dur);
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(0.4,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
    src.connect(filt);filt.connect(g);g.connect(audioCtx.destination);
    src.start();
  }catch(e){}
}
document.addEventListener('pointerdown',()=>{
  initAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  playBgm();
});
muteBtnEl.addEventListener('click',()=>{
  muted=!muted;
  muteBtnEl.textContent=muted?'🔇':'🔊';
  if(masterGain)masterGain.gain.value=muted?0:0.06;
  bgmEl.muted=muted;
});

/* ============================================================
   渲染循环：天空 → 沙滩 → 两层海浪 → 水线泡沫 →
   波光 → 物品（稀有带呼吸微光）→ 漂流瓶 → 特效
   ============================================================ */
const speckles=[];
for(let i=0;i<130;i++){
  speckles.push({x:Math.random()*W,y:WET_TOP+10+Math.random()*(H-WET_TOP-20),
    r:0.8+Math.random()*1.5,a:0.05+Math.random()*0.07});
}
function seaLayer(y0,amp,k,phase,bot,hAmp,hK,hPhase,fill){
  ctx.beginPath();
  ctx.moveTo(0,bot);
  for(let x=0;x<=W;x+=14){
    let y=y0+Math.sin(x*k+phase)*amp;
    if(hAmp)y+=Math.sin(x*hK+hPhase)*hAmp;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,bot);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
}
function foamLine(y0,extra,color,lw){
  ctx.beginPath();
  for(let x=0;x<=W;x+=13){
    const y=y0+Math.sin(x*0.021+timeSec*1.15+extra)*2.6;
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
}
function draw(){
  ctx.setTransform(sx,0,0,sy,0,0);
  /* v1.3：这一帧的昼夜配色 */
  const P=currentPal();
  const moonA=Math.max(0,(P.night-0.2)/0.8);   // 月亮 / 灯串的可见度
  /* 天空（随昼夜变化） */
  let g=ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,P.skyT);g.addColorStop(1,P.skyB);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HORIZON);
  /* 星星：天黑才一颗颗亮起来，各自轻轻眨 */
  if(P.night>0.02){
    for(const st of stars){
      const a=P.night*(0.35+0.4*Math.sin(timeSec*0.8+st.ph));
      if(a<=0.02)continue;
      ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      ctx.fillStyle='rgba(240,246,252,'+a.toFixed(3)+')';ctx.fill();
    }
  }
  /* 太阳：白天高挂，黄昏变得橙橙的、慢慢沉下去 */
  if(P.sunA>0.02){
    g=ctx.createRadialGradient(P.sunX,P.sunY,8,P.sunX,P.sunY,115);
    g.addColorStop(0,'rgba('+P.glowCol+','+P.sunA.toFixed(3)+')');
    g.addColorStop(1,'rgba('+P.glowCol+',0)');
    ctx.fillStyle=g;ctx.fillRect(P.sunX-140,Math.max(0,P.sunY-140),280,280);
    ctx.beginPath();ctx.arc(P.sunX,P.sunY,13,0,Math.PI*2);
    ctx.fillStyle='rgba('+P.sunCol+','+P.sunA.toFixed(3)+')';ctx.fill();
  }
  /* 月亮：天真正黑下来才升起，清清淡淡的满月 */
  if(moonA>0.02){
    const mx=985,my=102;
    g=ctx.createRadialGradient(mx,my,6,mx,my,64);
    g.addColorStop(0,'rgba(226,236,244,'+(0.5*moonA).toFixed(3)+')');
    g.addColorStop(1,'rgba(226,236,244,0)');
    ctx.fillStyle=g;ctx.fillRect(mx-64,my-64,128,128);
    ctx.beginPath();ctx.arc(mx,my,16,0,Math.PI*2);
    ctx.fillStyle='rgba(238,244,248,'+moonA.toFixed(3)+')';ctx.fill();
    ctx.strokeStyle='rgba(190,210,224,'+(0.6*moonA).toFixed(3)+')';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(198,214,226,'+(0.5*moonA).toFixed(3)+')';
    ctx.beginPath();ctx.arc(mx-5,my-3,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(mx+4,my+5,2.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(mx+6,my-6,1.6,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,'+(0.22*(1-P.night*0.7)).toFixed(3)+')';
  ctx.fillRect(0,HORIZON-16,W,20);
  /* 沙滩（上半部分平时泡在水里，大退潮才露出来，颜色更湿更深） */
  g=ctx.createLinearGradient(0,WET_TOP,0,H);
  g.addColorStop(0,P.sand1);g.addColorStop(0.4,P.sand2);g.addColorStop(1,P.sand3);
  ctx.fillStyle=g;ctx.fillRect(0,WET_TOP,W,H-WET_TOP);
  ctx.fillStyle='rgba(105,125,135,'+(0.10+0.06*P.night).toFixed(3)+')';
  ctx.fillRect(0,WET_TOP,W,548-WET_TOP);
  for(const p of speckles){
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(140,115,80,'+(p.a*(1-0.35*P.night)).toFixed(3)+')';ctx.fill();
  }
  const wl=waterlineY();
  /* 两层海浪：后层慢而缓，前层快一点、颜色更深 */
  seaLayer(256,6,Math.PI*2/340,timeSec*0.5,wl,0,0,0,P.seaB);
  const fg=ctx.createLinearGradient(0,288,0,wl+6);
  fg.addColorStop(0,P.seaT);fg.addColorStop(1,P.seaD);
  seaLayer(290,11,Math.PI*2/230,-timeSec*1.1,wl,3,Math.PI*2/95,timeSec*1.6,fg);
  /* 月光落在海面上：一条条淡淡的反光，越近越宽 */
  if(moonA>0.02){
    for(let i=0;i<12;i++){
      const ly=HORIZON+10+i*17;
      if(ly>wl-4)break;
      const w2=16+i*4;
      const ox=Math.sin(timeSec*0.6+i*1.3)*4;
      ctx.beginPath();
      ctx.moveTo(985-w2/2+ox,ly);ctx.lineTo(985+w2/2+ox,ly);
      ctx.strokeStyle='rgba(230,240,248,'+(moonA*0.18*(1-i/13)).toFixed(4)+')';
      ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
    }
  }
  /* 湿沙带 + 水线泡沫 */
  g=ctx.createLinearGradient(0,wl,0,wl+34);
  g.addColorStop(0,'rgba(95,120,130,0.20)');g.addColorStop(1,'rgba(95,120,130,0)');
  ctx.fillStyle=g;ctx.fillRect(0,wl,W,34);
  foamLine(wl,0,'rgba(255,255,255,'+(0.55*(1-0.35*P.night)).toFixed(3)+')',3);
  foamLine(wl+7,2.1,'rgba(255,255,255,'+(0.25*(1-0.35*P.night)).toFixed(3)+')',2);
  /* 波光 */
  for(const s of sparkles){
    const p=s.t/s.dur;
    ctx.save();
    ctx.globalAlpha=Math.sin(Math.PI*p)*0.65;
    ctx.translate(s.x,s.y);ctx.rotate(s.tilt);
    ctx.strokeStyle=P.waveCol;ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-s.len/2,0);ctx.lineTo(s.len/2,0);ctx.stroke();
    ctx.restore();
  }
  /* v1.3 装饰：凑齐套装后悄悄出现在沙滩和角落里 */
  for(const id of decorUnlocked){
    const a=decA(id);
    if(a<=0)continue;
    ctx.save();ctx.globalAlpha=a;
    if(id==='chime')drawChime();
    else if(id==='light')drawLight();
    else if(id==='umbrella')drawUmbrella();
    ctx.restore();
  }
  /* v1.4：小生物（海鸥飞过天空，海豚跃出海面，螃蟹横穿沙滩） */
  for(const c of critters){
    if(c.kind==='gull'){
      const p=c.t/c.dur;
      const y=c.baseY-Math.sin(p*Math.PI)*36+Math.sin(p*Math.PI*2)*14;
      ctx.save();
      ctx.translate(c.x,y);
      ctx.scale(c.sc*c.dir,c.sc);
      drawGull(ctx,7,Math.sin(timeSec*9+c.ph));
      ctx.restore();
    }else if(c.kind==='crab'){
      const hop=c.scare?0:Math.abs(Math.sin(c.t*9))*3;   // 横行时一跳一跳
      const sc=c.scare?Math.max(0.05,1-c.scareT):1;      // 被吓到：越缩越小钻进沙里
      ctx.save();
      ctx.globalAlpha=c.scare?Math.max(0,1-c.scareT*0.9):1;
      ctx.translate(c.x,c.y+(c.scare?c.scareT*9:0)-hop);
      if(c.dir<0)ctx.scale(-1,1);
      drawCrab(ctx,11*sc,c.t*(c.scare?30:10));
      ctx.restore();
    }else if(c.kind==='dolphin'){
      const p=Math.min(1,c.t/c.dur);
      const x=c.x0+c.dir*(p-0.5)*170;
      const y=c.y0-Math.sin(p*Math.PI)*58;
      /* 身体顺着弧线的切线方向转 */
      const vx=c.dir*170,vy=-Math.cos(p*Math.PI)*Math.PI*58;
      let ang=Math.atan2(vy,vx);
      ctx.save();
      ctx.translate(x,y);
      if(c.dir<0){ctx.scale(-1,1);ang=ang-Math.PI;}
      ctx.rotate(ang);
      drawDolphin(ctx,15);
      ctx.restore();
      /* 出水和入水的瞬间各溅一串小水花 */
      if(p<0.12||p>0.88){
        c.splashT=c.splashT||0;
        if(c.t-c.splashT>0.25){
          c.splashT=c.t;
          for(let k=0;k<4;k++){
            const a=-Math.PI*(0.3+Math.random()*0.4);
            effects.push({kind:'splash',x,y:c.y0,
              vx:Math.cos(a)*(40+Math.random()*50)*c.dir,vy:Math.sin(a)*(70+Math.random()*80),
              t:0,dur:0.45+Math.random()*0.15});
          }
        }
      }
    }
  }
  /* 沙滩上的物品（少见/稀有带缓慢呼吸的微光；送礼上岸的跟一道泡沫弧） */
  for(const it of items){
    if(it.alpha<=0)continue;
    const tp=typeInfo(it.typeId);
    const moving=it.delivery&&!it.delivery.done;
    ctx.save();
    ctx.globalAlpha=it.alpha;
    ctx.translate(it.x,it.y);
    if(tp.rarity>=1){
      const base=tp.rarity===2?0.25:0.14,amp=tp.rarity===2?0.10:0.06;
      const a=base+amp*Math.sin(timeSec*Math.PI);
      const col=tp.rarity===2?'255,236,180':'255,255,255';
      const g2=ctx.createRadialGradient(0,0,4,0,0,34);
      g2.addColorStop(0,'rgba('+col+','+a.toFixed(3)+')');
      g2.addColorStop(1,'rgba('+col+',0)');
      ctx.fillStyle=g2;
      ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();
    }
    if(moving){
      /* 随浪上岸：身后一个小浪头推着走，泡沫沿浪沿流动，还会轻轻摇晃 */
      const p=Math.min(1,it.delivery.t/it.delivery.dur);
      const sc=Math.sin(Math.PI*Math.min(1,0.2+p*0.8));
      const bw=34+16*sc,bh=9+9*sc;
      ctx.beginPath();
      ctx.moveTo(-bw,-13);
      ctx.quadraticCurveTo(0,-13-bh*1.7,bw,-13);
      ctx.quadraticCurveTo(bw*0.5,-13+bh*0.5,0,-13+bh*0.6);
      ctx.quadraticCurveTo(-bw*0.5,-13+bh*0.5,-bw,-13);
      ctx.closePath();
      ctx.fillStyle='rgba(126,196,205,'+(0.30+0.25*sc).toFixed(3)+')';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-bw,-13);
      ctx.quadraticCurveTo(0,-13-bh*1.7,bw,-13);
      ctx.strokeStyle='rgba(255,255,255,'+(0.45+0.35*sc).toFixed(3)+')';
      ctx.lineWidth=2+1.5*sc;ctx.lineCap='round';ctx.stroke();
      for(let i=0;i<3;i++){
        const ph=(it.delivery.t*0.8+i/3)%1;
        const fx=-bw+2*bw*ph;
        const fy=-13-bh*1.55*Math.sin(Math.PI*ph);
        ctx.beginPath();ctx.arc(fx,fy,1.5+1.2*sc,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,'+(0.4+0.35*sc).toFixed(3)+')';ctx.fill();
      }
      if(p<0.4){
        /* 刚从水里冒出来那会儿，身边还有一圈水波 */
        const wp=p/0.4;
        ctx.beginPath();ctx.arc(0,0,15+12*wp,-Math.PI*0.85,-Math.PI*0.15);
        ctx.strokeStyle='rgba(255,255,255,'+(0.35*(1-wp)).toFixed(3)+')';
        ctx.lineWidth=2;ctx.stroke();
      }
    }else{
      ctx.save();
      ctx.scale(1,0.35);
      ctx.beginPath();ctx.arc(0,26,13,0,Math.PI*2);
      ctx.fillStyle='rgba(105,85,60,0.16)';ctx.fill();
      ctx.restore();
    }
    ctx.rotate(it.rot+(moving?Math.sin(it.delivery.t*5)*0.18:0));
    tp.draw(ctx,16);
    ctx.restore();
  }
  /* 漂流瓶 */
  for(const b of bottles){
    if(b.alpha<=0)continue;
    ctx.save();
    ctx.globalAlpha=b.alpha;
    ctx.translate(b.x,b.y);
    ctx.save();
    ctx.scale(1,0.35);
    ctx.beginPath();ctx.arc(0,26,13,0,Math.PI*2);
    ctx.fillStyle='rgba(105,85,60,0.16)';ctx.fill();
    ctx.restore();
    drawBottle(ctx,15);
    ctx.restore();
  }
  /* 沙堆：小鼓包（挖开时塌成坑）/ 乖乖的石头 / 跑掉的小螃蟹 */
  for(const m of mounds){
    if(m.alpha<=0)continue;
    let a=m.alpha;
    if(m.settled&&m.result==='crab'&&m.crabT>1.1)a*=Math.max(0,1-(m.crabT-1.1)/0.3);
    ctx.save();
    ctx.globalAlpha=a;
    if(m.settled&&m.result==='crab'){
      const hop=Math.abs(Math.sin(m.crabT*10))*3;
      ctx.translate(m.x,m.y-6-hop);
      drawCrab(ctx,13,m.crabT);
    }else{
      const sink=m.dug?Math.min(1,m.digT/0.5):0;
      ctx.beginPath();ctx.ellipse(m.x,m.y+3,24,7,0,0,Math.PI*2);
      ctx.fillStyle='rgba(120,95,60,0.15)';ctx.fill();
      const hgt=15*(1-sink);
      if(hgt>1.5){
        ctx.beginPath();
        ctx.moveTo(m.x-22,m.y+2);
        ctx.quadraticCurveTo(m.x-20,m.y+2-hgt*0.8,m.x-6,m.y-hgt);
        ctx.quadraticCurveTo(m.x+9,m.y+2-hgt,m.x+16,m.y+2-hgt*0.55);
        ctx.quadraticCurveTo(m.x+21,m.y+2-hgt*0.15,m.x+22,m.y+2);
        ctx.closePath();
        ctx.fillStyle='#d9c497';ctx.fill();
        ctx.strokeStyle='rgba(150,120,75,0.35)';ctx.lineWidth=1.5;ctx.stroke();
      }
      if(sink>0.2){
        ctx.beginPath();ctx.ellipse(m.x,m.y+2,20,7,0,0,Math.PI*2);
        ctx.fillStyle='#cdb78a';ctx.fill();
        ctx.beginPath();ctx.ellipse(m.x,m.y+1,14,4.2,0,0,Math.PI*2);
        ctx.fillStyle='rgba(105,85,55,'+(0.45*Math.min(1,(sink-0.2)/0.4)).toFixed(3)+')';ctx.fill();
      }
      if(m.stone){
        ctx.beginPath();ctx.ellipse(m.x,m.y-3,11,8,0.15,0,Math.PI*2);
        ctx.fillStyle='#b8b2a6';ctx.fill();
        ctx.strokeStyle='rgba(120,113,100,0.55)';ctx.lineWidth=1.4;ctx.stroke();
        ctx.beginPath();ctx.ellipse(m.x-3,m.y-6,4,2.4,0.4,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fill();
      }
    }
    ctx.restore();
  }
  /* 特效：拾取涟漪 / 物品飘起 / 送礼泡沫圈·水迹·水花 / 沙堆的沙尘与沙粒 */
  for(const e of effects){
    const p=e.t/e.dur;
    if(e.kind==='ring'){
      ctx.beginPath();ctx.arc(e.x,e.y,10+32*p,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,'+(0.6*(1-p))+')';
      ctx.lineWidth=2.5;ctx.stroke();
    }else if(e.kind==='rise'){
      ctx.save();
      ctx.globalAlpha=1-p;
      ctx.translate(e.x,e.y-48*p);
      typeDraw(e.typeId)(ctx,15);
      ctx.restore();
    }else if(e.kind==='foam'){
      ctx.beginPath();ctx.arc(e.x,e.y,6+42*p,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,'+(0.55*(1-p))+')';
      ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(e.x,e.y,2+24*p,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,'+(0.35*(1-p))+')';
      ctx.lineWidth=2;ctx.stroke();
    }else if(e.kind==='trail'){
      /* 送礼身后的水迹：扁扁的湿痕，慢慢淡开 */
      ctx.globalAlpha=0.4*(1-p);
      ctx.fillStyle='rgba(205,230,234,1)';
      ctx.beginPath();
      ctx.ellipse(e.x,e.y,e.r*(1+0.5*p),e.r*0.35*(1+0.5*p),0,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    }else if(e.kind==='splash'){
      /* 到岸的小水花：白点抛出去又落下来 */
      ctx.globalAlpha=0.9*(1-p);
      ctx.fillStyle='#ffffff';
      ctx.beginPath();
      ctx.arc(e.x+e.vx*e.t,e.y+e.vy*e.t+170*e.t*e.t,2,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    }else if(e.kind==='puff'){
      ctx.globalAlpha=0.5*(1-p);
      ctx.fillStyle='#c9b183';
      ctx.beginPath();ctx.arc(e.x+e.drift*p,e.y-12*p,1.6,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.x+e.drift*p+4,e.y-12*p-4,1.2,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }else if(e.kind==='grain'){
      ctx.globalAlpha=1-p;
      ctx.fillStyle='#cdb178';
      ctx.beginPath();
      ctx.arc(e.x+e.vx*e.t,e.y+e.vy*e.t+130*e.t*e.t,1.8,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

/* ---------- 潮汐条 UI 每帧刷新（含大退潮星星预告） ---------- */
const tideMarkEl=document.getElementById('tideMark');
const tideLabelEl=document.getElementById('tideLabel');
const bigStarEl=document.getElementById('bigStar');
let lastLabel='';
function uiFrame(){
  tideMarkEl.style.left=(tideLevel()*100)+'%';
  const t=tideLevel();
  const star=nextIsBig()&&!bigTideActive;
  bigStarEl.style.display=star?'block':'none';
  let lbl;
  if(canCollect())lbl=bigTideActive?'大退潮 · 捡好东西啦':'退潮 · 可以捡东西啦';
  else if(star)lbl='下一次是大退潮';
  else if(t>0.7)lbl='涨潮 · 等海水退去';
  else lbl=(Math.sin(timeSec/TIDE_PERIOD*Math.PI*2+TIDE_PHASE_VAL)>0)?'涨潮中…':'退潮中…';
  if(lbl!==lastLabel){tideLabelEl.textContent=lbl;lastLabel=lbl;}
}

/* ---------- 主循环 ---------- */
function loop(ts){
  if(lastTs===null)lastTs=ts;
  const dt=Math.min(0.05,Math.max(0,(ts-lastTs)/1000));
  lastTs=ts;
  update(dt);
  draw();
  uiFrame();
  requestAnimationFrame(loop);
}
loadSave();
refreshBook();
window.addEventListener('pagehide',saveGame);
if(stats.visitDays>1)setTimeout(()=>showToast('第 '+stats.visitDays+' 次来看海'),600);
setTimeout(()=>showToast('退潮的时候，可以在沙滩上捡贝壳哦~'),1900);
requestAnimationFrame(loop);

/* 调试用的只读入口（也方便自己改着玩）：
   __game.skip(秒数) 可以把游戏时间往前跳，用来快速看大退潮 */
window.__game={
  items,bottles,mounds,counts,
  tide:tideLevel,canCollect,
  big:()=>bigTideActive,
  retreat:()=>retreatCount,
  t:()=>timeSec,
  crabs:()=>crabSeen,
  deliverAt:()=>deliverAt,
  mound:(n)=>spawnMounds(n||1,0),
  deliver:()=>spawnDelivery(),
  day:()=>dayTime,
  setDay:v=>{dayTime=((v%DAY_LENGTH)+DAY_LENGTH)%DAY_LENGTH;},
  night:()=>currentPal().night,
  decor:()=>[...decorUnlocked],
  check:checkDecor,
  pick:pickType,
  critters,
  gull:()=>spawnGull(),
  crabWalk:()=>spawnCrabWalk(),
  dolphin:()=>spawnDolphin(),
  friends:()=>({crab:crabSeen,dolphin:dolphinSeen,seagull:seagullSeen}),
  skip:s=>{
    const steps=Math.ceil(s/0.05);
    for(let i=0;i<steps;i++){
      timeSec+=Math.min(0.05,s-i*0.05);
      checkTide();
    }
  },
  bgm:bgmEl
};
</script>
